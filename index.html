<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>糖尿病足压力监测 · USB / 蓝牙</title>
<style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
    body {
        background: #0b0f1a; min-height: 100vh; margin: 0;
        display: flex; justify-content: center; align-items: center; padding: 16px;
    }
    .card {
        background: #1e2432; max-width: 1100px; width: 100%;
        border-radius: 48px; padding: 28px 28px 36px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 0 2px #2d3648 inset;
        color: #eef2ff;
    }

    /* ===== 两栏布局 ===== */
    .main-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        align-items: stretch;
    }
    @media (max-width: 820px) {
        .main-layout { grid-template-columns: 1fr; }
    }

    .left-col, .right-col {
        display: flex; flex-direction: column; gap: 20px;
    }

    /* ===== 工具栏 ===== */
    .toolbar {
        display: flex; flex-direction: column; gap: 12px;
        margin-bottom: 20px; padding: 0 4px;
    }
    .toolbar-row {
        display: flex; justify-content: space-between; align-items: center;
        gap: 12px;
    }
    .mode-switch {
        display: flex; background: #141a26; border-radius: 60px;
        padding: 4px; border: 1px solid #2e3f5e;
    }
    .mode-btn {
        flex: 1; padding: 8px 18px; border: none; background: transparent;
        color: #8a99bb; font-weight: 600; font-size: 13px;
        border-radius: 60px; cursor: pointer; transition: all 0.2s;
        white-space: nowrap;
    }
    .mode-btn.active {
        background: #2a4fd6; color: #fff;
        box-shadow: 0 2px 8px rgba(61,110,255,0.5);
    }
    .mode-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn {
        background: linear-gradient(180deg, #3d6eff, #2a4fd6);
        color: #fff; font-weight: 700; font-size: 15px;
        padding: 12px 24px; border: none; border-radius: 60px;
        cursor: pointer; transition: all 0.15s;
        box-shadow: 0 4px 0 #1a3aa8, 0 6px 20px rgba(61,110,255,0.4);
        letter-spacing: 0.5px;
        flex: 1;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #1a3aa8; }
    .btn.disconnect {
        background: linear-gradient(180deg, #ff4d4d, #d62a2a);
        box-shadow: 0 4px 0 #a81a1a, 0 6px 20px rgba(255,77,77,0.4);
    }

    .conn-status {
        font-size: 13px; color: #8a99bb; padding: 6px 14px;
        border-radius: 30px; background: #141a26;
        border: 1px solid #2e3f5e;
        white-space: nowrap;
    }
    .conn-status.connected { color: #2aff6e; border-color: #2aff6e; }

    .hint {
        font-size: 12px; color: #6b7b9c; padding: 0 8px;
        min-height: 16px;
    }

    /* ===== 传感器面板 ===== */
    .oled-panel {
        background: #0a0c12; border-radius: 28px; padding: 20px 22px 18px;
        border: 2px solid #3a445c;
        box-shadow: 0 0 0 1px #000, 0 10px 20px rgba(0,0,0,0.7) inset;
        flex: 1;
        display: flex; flex-direction: column;
    }
    .oled-header {
        display: flex; justify-content: space-between; align-items: center;
        font-size: 13px; letter-spacing: 1px; color: #b7c2e0;
        border-bottom: 1px solid #2e3a50; padding-bottom: 8px;
        margin-bottom: 16px; text-transform: uppercase;
    }
    .sensor-grid {
        display: grid; grid-template-columns: 1fr 1fr;
        gap: 14px; margin-bottom: 20px;
    }
    .sensor-item {
        background: #141a26; border-radius: 18px; padding: 10px 14px;
        border: 1px solid #2e3f5e; box-shadow: 0 2px 0 #0b0e14;
    }
    .sensor-label {
        font-size: 13px; color: #a5b3d6; display: flex;
        justify-content: space-between; margin-bottom: 6px;
    }
    .sensor-value {
        font-size: 34px; font-weight: 800; line-height: 1;
        color: #dfe8ff; text-shadow: 0 0 8px #4d7dff;
        font-variant-numeric: tabular-nums;
    }
    .sensor-value .unit {
        font-size: 15px; color: #8a99bb; margin-left: 4px; font-weight: 600;
    }
    .threshold-hint { font-size: 11px; color: #6d7e9e; margin-top: 4px; }
    .status-row {
        display: flex; justify-content: space-between; align-items: center;
        margin-top: auto; border-top: 1px solid #2e3a50; padding-top: 16px;
        gap: 10px;
    }
    .led-group { display: flex; gap: 18px; align-items: center; }
    .led { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; }
    .led-bulb {
        width: 26px; height: 26px; border-radius: 50%; background: #2a2f3c;
        box-shadow: 0 0 0 2px #1a1e28, 0 0 0 4px #0b0f1a; transition: all 0.15s;
    }
    .led-red.active .led-bulb {
        background: #ff2a2a;
        box-shadow: 0 0 16px #ff2a2a, 0 0 0 2px #1a1e28, 0 0 0 4px #0b0f1a;
    }
    .led-green.active .led-bulb {
        background: #2aff6e;
        box-shadow: 0 0 16px #2aff6e, 0 0 0 2px #1a1e28, 0 0 0 4px #0b0f1a;
    }
    .status-message {
        font-size: 14px; font-weight: 700; padding: 8px 16px;
        border-radius: 60px; background: #1d2a3a; color: #b7d0ff;
        border: 1px solid #3d5170;
        white-space: nowrap;
    }
    .status-message.warning {
        background: #4a1e1e; color: #ffb3b3; border-color: #ff5e5e;
        text-shadow: 0 0 6px #ff0000;
    }

    /* ===== 图表 ===== */
    .chart-panel {
        background: #0a0c12; border-radius: 28px; padding: 18px 20px 16px;
        border: 2px solid #3a445c;
        box-shadow: 0 0 0 1px #000, 0 10px 20px rgba(0,0,0,0.7) inset;
        flex: 1;
        display: flex; flex-direction: column;
        min-height: 380px;
    }
    .chart-header {
        display: flex; flex-direction: column; gap: 8px;
        font-size: 12px; color: #b7c2e0; letter-spacing: 1px;
        border-bottom: 1px solid #2e3a50; padding-bottom: 10px; margin-bottom: 12px;
        text-transform: uppercase;
    }
    .chart-legend { display: flex; gap: 12px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #a5b3d6; }
    .legend-color { width: 12px; height: 3px; border-radius: 2px; }
    #chartCanvas {
        width: 100%; flex: 1; display: block; min-height: 260px;
        background: #05070c; border-radius: 12px;
    }

    .footer-note {
        display: flex; justify-content: space-between; align-items: center;
        margin-top: 20px; color: #6b7b9c; font-size: 13px; padding: 0 8px;
    }
    .sim-tag {
        background: #1e2a3e; padding: 4px 12px; border-radius: 30px;
        color: #9bb1db;
    }
    .dot {
        width: 8px; height: 8px; background: #2aff6e;
        border-radius: 50%; display: inline-block; animation: blink 1s infinite;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
</style>
</head>
<body>
<div class="card">

    <!-- 顶部工具栏：横跨整个卡片 -->
    <div class="toolbar">
        <div class="mode-switch">
            <button class="mode-btn active" id="modeUsb" data-mode="usb">🔌 USB 直连</button>
            <button class="mode-btn" id="modeBt" data-mode="bt">📡 蓝牙 HC-06</button>
        </div>
        <div class="toolbar-row">
            <button class="btn" id="connectBtn">🔗 连接串口</button>
            <span class="conn-status" id="connStatus">未连接</span>
        </div>
        <div class="hint" id="hintText">USB 模式：用数据线连接 Arduino Nano，选择它的 COM 口。</div>
    </div>

    <!-- 两栏主体：左=传感器+状态，右=曲线图 -->
    <div class="main-layout">

        <!-- 左栏 -->
        <div class="left-col">
            <div class="oled-panel">
                <div class="oled-header">
                    <span>🩺 Diabetic Foot Alert</span>
                    <span id="connTypeLabel">未连接</span>
                </div>

                <div class="sensor-grid">
                    <div class="sensor-item">
                        <div class="sensor-label">
                            <span>P1 脚跟</span>
                            <span style="font-size:10px;color:#7f8fb0;background:#0e131f;padding:2px 6px;border-radius:30px;">阈16.0</span>
                        </div>
                        <div class="sensor-value" id="p1Val">--<span class="unit">kg</span></div>
                        <div class="threshold-hint" id="p1Hint"></div>
                    </div>
                    <div class="sensor-item">
                        <div class="sensor-label">
                            <span>P2 足弓</span>
                            <span style="font-size:10px;color:#7f8fb0;background:#0e131f;padding:2px 6px;border-radius:30px;">阈3.2</span>
                        </div>
                        <div class="sensor-value" id="p2Val">--<span class="unit">kg</span></div>
                        <div class="threshold-hint" id="p2Hint"></div>
                    </div>
                    <div class="sensor-item">
                        <div class="sensor-label">
                            <span>P3 前掌内</span>
                            <span style="font-size:10px;color:#7f8fb0;background:#0e131f;padding:2px 6px;border-radius:30px;">阈11.2</span>
                        </div>
                        <div class="sensor-value" id="p3Val">--<span class="unit">kg</span></div>
                        <div class="threshold-hint" id="p3Hint"></div>
                    </div>
                    <div class="sensor-item">
                        <div class="sensor-label">
                            <span>P4 前掌外</span>
                            <span style="font-size:10px;color:#7f8fb0;background:#0e131f;padding:2px 6px;border-radius:30px;">阈8.0</span>
                        </div>
                        <div class="sensor-value" id="p4Val">--<span class="unit">kg</span></div>
                        <div class="threshold-hint" id="p4Hint"></div>
                    </div>
                </div>

                <div class="status-row">
                    <div class="led-group">
                        <div class="led led-red" id="ledRed">
                            <div class="led-bulb"></div>
                            <span>红</span>
                        </div>
                        <div class="led led-green" id="ledGreen">
                            <div class="led-bulb"></div>
                            <span>绿</span>
                        </div>
                    </div>
                    <div class="status-message" id="statusMsg">等待数据...</div>
                </div>
            </div>
        </div>

        <!-- 右栏：曲线图 -->
        <div class="right-col">
            <div class="chart-panel">
                <div class="chart-header">
                    <span>📈 压力趋势 · 最近 60 秒</span>
                    <div class="chart-legend">
                        <div class="legend-item"><span class="legend-color" style="background:#4d7dff;"></span>P1 脚跟</div>
                        <div class="legend-item"><span class="legend-color" style="background:#2aff6e;"></span>P2 足弓</div>
                        <div class="legend-item"><span class="legend-color" style="background:#ffb020;"></span>P3 前掌内</div>
                        <div class="legend-item"><span class="legend-color" style="background:#ff4d4d;"></span>P4 前掌外</div>
                    </div>
                </div>
                <canvas id="chartCanvas"></canvas>
            </div>
        </div>
    </div>

    <div class="footer-note">
        <div class="sim-tag" id="footerTag">📡 未连接</div>
        <div style="display:flex;align-items:center;gap:6px;">
            <span class="dot"></span> 数据接收中
        </div>
    </div>
</div>

<script>
(function() {
    // ===== 阈值（KG）=====
    const THRESHOLDS = [16.0, 3.2, 11.2, 8.0];
    const BAUD_RATE = 9600;

    // ===== 曲线颜色 & 数据缓冲 =====
    const SERIES_COLORS = ['#4d7dff', '#2aff6e', '#ffb020', '#ff4d4d'];
    const MAX_POINTS = 300;
    const history = [[], [], [], []];

    // ===== DOM =====
    const connectBtn = document.getElementById('connectBtn');
    const connStatus = document.getElementById('connStatus');
    const connTypeLabel = document.getElementById('connTypeLabel');
    const hintText = document.getElementById('hintText');
    const footerTag = document.getElementById('footerTag');
    const modeUsb = document.getElementById('modeUsb');
    const modeBt = document.getElementById('modeBt');

    const p1Val = document.getElementById('p1Val');
    const p2Val = document.getElementById('p2Val');
    const p3Val = document.getElementById('p3Val');
    const p4Val = document.getElementById('p4Val');
    const p1Hint = document.getElementById('p1Hint');
    const p2Hint = document.getElementById('p2Hint');
    const p3Hint = document.getElementById('p3Hint');
    const p4Hint = document.getElementById('p4Hint');
    const ledRed = document.getElementById('ledRed');
    const ledGreen = document.getElementById('ledGreen');
    const statusMsg = document.getElementById('statusMsg');

    // ===== 图表 Canvas =====
    const canvas = document.getElementById('chartCanvas');
    const ctx = canvas.getContext('2d');
    let chartWidth = 0, chartHeight = 0;

    function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        chartWidth = rect.width;
        chartHeight = rect.height;
        drawChart();
    }

    window.addEventListener('resize', resizeCanvas);

    // ===== 状态 =====
    let port = null;
    let reader = null;
    let keepReading = false;
    let weights = [null, null, null, null];
    let currentMode = 'usb';

    // ===== 模式切换 =====
    modeUsb.addEventListener('click', () => setMode('usb'));
    modeBt.addEventListener('click', () => setMode('bt'));

    function setMode(mode) {
        if (port) { alert('请先断开当前连接，再切换模式。'); return; }
        currentMode = mode;
        if (mode === 'usb') {
            modeUsb.classList.add('active');
            modeBt.classList.remove('active');
            hintText.textContent = 'USB 模式：用数据线连接 Arduino Nano，选择它的 COM 口。';
        } else {
            modeBt.classList.add('active');
            modeUsb.classList.remove('active');
            hintText.textContent = '蓝牙模式：先配对 HC-06，选择配对后生成的蓝牙 COM 口。';
        }
    }

    // ===== 连接 =====
    connectBtn.addEventListener('click', async () => {
        if (port) await disconnect(); else await connect();
    });

    async function connect() {
        if (!('serial' in navigator)) {
            alert('当前浏览器不支持 Web Serial。\n请使用 Chrome 或 Edge，并通过 https 或 localhost 打开本页面。');
            return;
        }
        try {
            port = await navigator.serial.requestPort();
            await port.open({ baudRate: BAUD_RATE });

            const label = currentMode === 'usb' ? 'USB' : '蓝牙';
            connStatus.textContent = `已连接 · ${label} · 等待数据`;
            connStatus.classList.add('connected');
            connTypeLabel.textContent = `${label} · ${BAUD_RATE}`;
            connectBtn.textContent = '🔌 断开连接';
            connectBtn.classList.add('disconnect');
            modeUsb.disabled = true;
            modeBt.disabled = true;

            keepReading = true;
            readLoop();
        } catch (err) {
            console.error(err);
            if (err.name !== 'NotFoundError') {
                const tips = currentMode === 'usb'
                    ? '\n\nUSB 模式提示：\n1. 确认 Nano 已用数据线连到电脑\n2. 安装 CH340 驱动\n3. 关闭 Arduino IDE 的串口监视器\n4. 选择 Nano 对应的 COM 口'
                    : '\n\n蓝牙模式提示：\n1. 先配对 HC-06（密码 1234）\n2. 配对后生成蓝牙 COM 口\n3. 选择该蓝牙 COM 口\n4. 关闭占用该串口的其他软件';
                alert('连接失败：' + err.message + tips);
            }
            port = null;
            resetUI();
        }
    }

    async function disconnect() {
        keepReading = false;
        try {
            if (reader) { try { await reader.cancel(); } catch (_) {} reader = null; }
            if (port) { try { await port.close(); } catch (_) {} port = null; }
        } catch (e) { console.error(e); }
        resetUI();
    }

    function resetUI() {
        connStatus.textContent = '未连接';
        connStatus.classList.remove('connected');
        connTypeLabel.textContent = '未连接';
        connectBtn.textContent = '🔗 连接串口';
        connectBtn.classList.remove('disconnect');
        modeUsb.disabled = false;
        modeBt.disabled = false;
    }

    // ===== 串口读取 =====
    async function readLoop() {
        const decoder = new TextDecoder();
        let buffer = '';
        while (port && port.readable && keepReading) {
            try {
                reader = port.readable.getReader();
                while (keepReading) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    let lines = buffer.split('\n');
                    buffer = lines.pop();
                    lines.forEach(line => parseLine(line.trim()));
                }
            } catch (e) {
                console.error('读取错误:', e);
                break;
            } finally {
                if (reader) { try { reader.releaseLock(); } catch (_) {} reader = null; }
            }
        }
    }

    function parseLine(line) {
        if (!line) return;
        const m = line.match(/P1:([\d.]+)\s*kg\s+P2:([\d.]+)\s*kg\s+P3:([\d.]+)\s*kg\s+P4:([\d.]+)\s*kg/);
        if (m) {
            weights[0] = parseFloat(m[1]);
            weights[1] = parseFloat(m[2]);
            weights[2] = parseFloat(m[3]);
            weights[3] = parseFloat(m[4]);
            updateDisplay();

            const label = currentMode === 'usb' ? 'USB' : '蓝牙';
            connStatus.textContent = `已连接 · ${label} · 接收中`;
        }
    }

    // ===== 更新 =====
    function updateDisplay() {
        const w = weights;
        if (w[0] === null) return;

        p1Val.innerHTML = w[0].toFixed(1) + '<span class="unit">kg</span>';
        p2Val.innerHTML = w[1].toFixed(1) + '<span class="unit">kg</span>';
        p3Val.innerHTML = w[2].toFixed(1) + '<span class="unit">kg</span>';
        p4Val.innerHTML = w[3].toFixed(1) + '<span class="unit">kg</span>';

        p1Hint.textContent = w[0] > THRESHOLDS[0] ? '⚠️ 超压' : '';
        p2Hint.textContent = w[1] > THRESHOLDS[1] ? '⚠️ 超压' : '';
        p3Hint.textContent = w[2] > THRESHOLDS[2] ? '⚠️ 超压' : '';
        p4Hint.textContent = w[3] > THRESHOLDS[3] ? '⚠️ 超压' : '';

        const warning = w.some((v, i) => v > THRESHOLDS[i]);
        if (warning) {
            ledRed.classList.add('active');
            ledGreen.classList.remove('active');
            statusMsg.textContent = 'WARNING! CHECK POINTS';
            statusMsg.classList.add('warning');
        } else {
            ledRed.classList.remove('active');
            ledGreen.classList.add('active');
            statusMsg.textContent = 'Status: NORMAL';
            statusMsg.classList.remove('warning');
        }

        for (let i = 0; i < 4; i++) {
            history[i].push(w[i]);
            if (history[i].length > MAX_POINTS) history[i].shift();
        }
        drawChart();

        const label = currentMode === 'usb' ? 'USB' : '蓝牙';
        footerTag.textContent = `📡 ${label} · 真实数据`;
    }

    // ===== 画图 =====
    function drawChart() {
        if (!chartWidth || !chartHeight) return;
        ctx.clearRect(0, 0, chartWidth, chartHeight);

        let maxVal = Math.max(...THRESHOLDS);
        for (let i = 0; i < 4; i++) {
            for (const v of history[i]) if (v > maxVal) maxVal = v;
        }
        maxVal = maxVal * 1.15 || 10;
        if (maxVal < 5) maxVal = 5;

        const padLeft = 32, padRight = 8, padTop = 10, padBottom = 20;
        const plotW = chartWidth - padLeft - padRight;
        const plotH = chartHeight - padTop - padBottom;

        // 网格
        ctx.strokeStyle = '#1c2536';
        ctx.lineWidth = 1;
        ctx.font = '10px "Segoe UI", sans-serif';
        ctx.fillStyle = '#6b7b9c';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';

        const yTicks = 4;
        for (let i = 0; i <= yTicks; i++) {
            const yVal = (maxVal / yTicks) * i;
            const y = padTop + plotH - (yVal / maxVal) * plotH;
            ctx.beginPath();
            ctx.moveTo(padLeft, y);
            ctx.lineTo(padLeft + plotW, y);
            ctx.stroke();
            ctx.fillText(yVal.toFixed(1), padLeft - 6, y);
        }

        // X 轴
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        for (let i = 0; i <= 4; i++) {
            const x = padLeft + (plotW / 4) * i;
            ctx.fillText(`-${((4 - i) * 7.5).toFixed(0)}s`, x, padTop + plotH + 4);
        }

        // 阈值虚线
        for (let i = 0; i < 4; i++) {
            const th = THRESHOLDS[i];
            if (th > maxVal) continue;
            const y = padTop + plotH - (th / maxVal) * plotH;
            ctx.save();
            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = SERIES_COLORS[i] + '66';
            ctx.beginPath();
            ctx.moveTo(padLeft, y);
            ctx.lineTo(padLeft + plotW, y);
            ctx.stroke();
            ctx.restore();
        }

        // 曲线
        for (let i = 0; i < 4; i++) {
            const data = history[i];
            if (data.length < 2) continue;
            ctx.strokeStyle = SERIES_COLORS[i];
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let j = 0; j < data.length; j++) {
                const x = padLeft + (plotW * j) / (MAX_POINTS - 1);
                const y = padTop + plotH - (data[j] / maxVal) * plotH;
                if (j === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        // 边框
        ctx.strokeStyle = '#2e3a50';
        ctx.lineWidth = 1;
        ctx.strokeRect(padLeft, padTop, plotW, plotH);
    }

    window.addEventListener('load', () => {
        resizeCanvas();
        drawChart();
    });

    window.addEventListener('beforeunload', () => {
        if (port) { try { port.close(); } catch (_) {} }
    });
})();
</script>
</body>
</html>
